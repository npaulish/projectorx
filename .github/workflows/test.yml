# This workflow will install Python dependencies, run tests and lint.
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python

name: Test Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Test all supported Python versions under Ubuntu
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']

    runs-on: ${{ matrix.os }}
    env:
      OPENMX_VERSION: "3.9"
      OPENMX_TAR: "projectorx/paolibs/openmx3.9.tar.gz"
      PAO_PATH: "projectorx/paolibs/openmx3.9/openmx3.9/DFT_DATA19/PAO"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # Cache the OpenMX tarball so we don't redownload every run
    - name: Cache OpenMX tarball
      id: cache-openmx
      uses: actions/cache@v4
      with:
        path: ${{ env.OPENMX_TAR }}
        key: openmx-tar-${{ env.OPENMX_VERSION }}-
          ${{ hashFiles('.github/workflows/test.yml') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82
        # exit-zero treats all errors as warnings
        ruff check --exit-zero --statistics
    - name: Install project
      run: |
        pip install .
    # Ensure OpenMX is available (download if not cached)
    - name: Ensure OpenMX PAO directory
      run: |
        python - <<'PYCODE'
        from pathlib import Path
        from projectorx import utils
        utils.ensure_openmx_exists(Path("${{ env.PAO_PATH }}"), auto=True)
        PYCODE

    - name: Run tests
      run: |
        pytest
