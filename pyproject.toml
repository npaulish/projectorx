[project]
name = "projectorx"
version = "0.1.0"
description = "Tools to generate required projectors for Wannierization"
readme = "README.md"
authors = [
  {name = "Yuhao Jiang", email = "jiangyh@buaa.edu.cn"},
  {name = "Nataliya Paulish", email = "nataliya.paulish@psi.ch"},
  {name = "Junfeng Qiao", email = "qiaojunfeng@outlook.com"}
]
maintainers = [
  {name = "Nataliya Paulish", email = "nataliya.paulish@psi.ch"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "typer>=0.20",
  "numpy>=1.24",
  "scipy>=1.10",
  "upf_tools>=0.1.9",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage>=7.6",  # testing
    "pytest>=8.3",  # testing
    "ruff>=0.14",  # linting
    "ty>=0.0.1a24", # checking types
    "ipdb>=0.13", # debugging
]
aiida = [
    "aiida-core>=2.0",
    "aiida-wannier90-workflows>=2.0",
]

[project.urls]
bugs = "https://github.com/npaulish/projectorx/issues"
changelog = "https://github.com/npaulish/projectorx/blob/master/changelog.md"
homepage = "https://github.com/npaulish/projectorx"

[project.scripts]
projectorx = "projectorx.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
